<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#f4eee7">
  <title>Private invitation — PROPOSER</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .locked-page { min-height: 100svh; display: grid; place-items: center; padding: 30px; text-align: center; }

    .locked-card h1 { font: 500 clamp(52px, 10vw, 76px)/1 var(--serif); letter-spacing: -.06em; margin: 22px 0; }
    .locked-card p { color: var(--muted); font-size: 14px; line-height: 1.9; }
  </style>
</head>
<body>
  <main class="locked-page">
    <section class="locked-card">
      <div class="footer-mark">P<span>.</span></div>
      <p class="eyebrow">A PRIVATE LITTLE PLACE</p>
      <h1>This link is<br><em>for one person.</em></h1>
      <p>Please open the invitation link Foster sent you. If you think you have the right link, ask him to send it again.</p>
    </section>
  </main>
</body>
</html>
